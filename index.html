<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sticker Forge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root, :root[data-theme=light] { --bg: #ffffff; --fg: #111111; --hint: #7d7d85; --card: #f1f1f4; --btn: #2481cc; --btn-fg: #ffffff; --chk1: #d9d9de; --chk2: #f4f4f7; color-scheme: light; }
  :root[data-theme=dark] { --bg: #17212b; --fg: #f1f4f8; --hint: #8b9aa8; --card: #232e3c; --btn: #4a90d9; --btn-fg: #ffffff; --chk1: #2b3a4a; --chk2: #34465a; color-scheme: dark; }
  .theme { background: var(--card); color: var(--fg); border: 0; border-radius: 14px; padding: 5px 10px; font-size: 15px; }
  .fonts { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
  .fbtn { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: start; border: 0; background: var(--bg); color: var(--fg); border-radius: 10px; padding: 8px 10px; font: inherit; }
  .fbtn.on { outline: 2px solid var(--btn); }
  .fbtn .fname { font-size: 11px; color: var(--hint); flex: 0 0 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fbtn .fsample { font-size: 20px; flex: 1; text-align: end; white-space: nowrap; overflow: hidden; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; padding-bottom: 90px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 4px; }
  header h1 { font-size: 17px; margin: 0; }
  .lang { background: var(--card); color: var(--fg); border: 0; border-radius: 14px; padding: 5px 12px; font-size: 13px; }
  .stage { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 14px 10px; text-align: center; }
  canvas { width: min(100%, 300px); aspect-ratio: 1; border-radius: 16px; touch-action: none; display: block; margin: 0 auto;
           background: repeating-conic-gradient(var(--chk1) 0% 25%, var(--chk2) 0% 50%) 50% / 24px 24px; }
  .hint { color: var(--hint); font-size: 12px; margin-top: 6px; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
  .card { background: var(--card); border-radius: 14px; padding: 12px; margin: 10px 14px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--hint); font-weight: 600; letter-spacing: .02em; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chip, .seg button, .btn, .sw { border: 0; font: inherit; color: var(--fg); background: var(--bg); border-radius: 10px; padding: 8px 4px; }
  .chip.on, .seg button.on, .sw.on { background: var(--btn); color: var(--btn-fg); }
  .seg { display: flex; gap: 6px; } .seg button { flex: 1; }
  .sw { width: 34px; height: 34px; padding: 0; border: 3px solid var(--bg); } .sw.on { border-color: var(--btn); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  label.field { display: block; margin-top: 10px; font-size: 13px; color: var(--hint); }
  select, input[type=text] { width: 100%; margin-top: 4px; padding: 9px; border: 0; border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit; }
  .btn { background: var(--btn); color: var(--btn-fg); padding: 9px 14px; }
  .btn.alt { background: var(--bg); color: var(--fg); }
  details summary { cursor: pointer; font-weight: 600; color: var(--hint); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; }
  .lrow { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 10px; padding: 5px 8px; }
  .lrow.on { outline: 2px solid var(--btn); }
  .lrow canvas { width: 36px; height: 36px; border-radius: 6px; flex: none; margin: 0; }
  .lrow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .lrow button { border: 0; background: var(--card); color: var(--fg); border-radius: 8px; width: 32px; height: 32px; font: inherit; }
  .note { color: var(--hint); font-size: 12px; margin-top: 6px; }
  #sendFallback { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); display: none; }
  #sendFallback button { width: 100%; padding: 13px; font-size: 16px; }
  [dir=rtl] .seg, [dir=rtl] .chips { direction: rtl; }
</style>
</head>
<body>
<header><h1 id="title">Sticker Forge</h1><div><button class="theme" id="themeBtn" title="theme">🌙</button> <button class="lang" id="langBtn">فارسی</button></div></header>

<div class="stage">
  <canvas id="cv" width="512" height="512"></canvas>
  <div class="hint" id="dragHint"></div>
  <div class="seg" id="moveMode" style="max-width:300px;margin:6px auto 0"></div>
  <div class="row">
    <label class="btn alt" id="pickLbl"><input type="file" id="file" accept="image/*" multiple hidden><span id="pickTxt"></span></label>
    <button class="btn alt" id="demoBtn"></button>
  </div>
</div>

<div class="card"><h2 id="h_fx"></h2><div class="chips" id="chips"></div>
  <div class="grid2"><label class="field"><span id="l_fx2"></span><select id="fx2"></select></label>
  <label class="field"><span id="l_fx3"></span><select id="fx3"></select></label></div></div>

<div class="card" id="layersCard" style="display:none"><h2 id="h_layers"></h2><div class="note" id="layHint"></div>
  <div id="layerList" style="display:grid;gap:6px;margin-top:8px"></div>
  <label class="field"><span id="l_layScale"></span> <b id="layScaleVal"></b></label>
  <input type="range" id="layScale" min="10" max="300" step="1" style="width:100%">
  <div class="row" style="justify-content:flex-start"><button class="btn alt" id="layAuto"></button></div></div>

<div class="card"><h2 id="h_motion"></h2><div class="seg" id="speed"></div><div class="seg" id="intensity" style="margin-top:8px"></div></div>
<div class="card"><h2 id="h_outline"></h2><div class="seg" id="outline"></div></div>

<div class="card"><h2 id="h_text"></h2>
  <input type="text" id="text" maxlength="28" autocomplete="off">
  <label class="field"><span id="l_size"></span> <b id="sizeVal"></b></label><div class="seg" id="tsize"></div>
  <input type="range" id="sizeRange" min="20" max="160" step="1" style="width:100%;margin-top:6px">
  <label class="field"><span id="l_color"></span></label>
  <div class="swatches" id="colors"></div>
  <div class="row" style="justify-content:flex-start"><input type="color" id="colorPick" style="width:56px;height:38px;border:0;padding:0;background:none"><span class="note" id="colorHex"></span></div>
  <label class="field"><span id="l_stroke"></span> <b id="strokeVal"></b></label>
  <div class="row" style="justify-content:flex-start;gap:10px"><input type="range" id="strokeRange" min="0" max="16" step="1" style="flex:1"><button class="btn alt" id="strokeAuto"></button></div>
  <div class="row" style="justify-content:flex-start"><input type="color" id="strokeColor" style="width:56px;height:38px;border:0;padding:0;background:none"><button class="btn alt" id="strokeColorAuto"></button></div>
  <label class="field"><span id="l_tfx"></span></label><div class="chips" id="tfx"></div>
  <div class="grid2"><label class="field"><span id="l_tfx2"></span><select id="tfx2"></select></label>
  <label class="field"><span id="l_tfx3"></span><select id="tfx3"></select></label></div>
  <label class="field"><span id="l_font"></span></label><div class="fonts" id="fontList"></div>
  <div class="row" style="justify-content:flex-start"><label class="btn alt"><input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden><span id="fontPick"></span></label></div>
  <div class="note" id="fontNote"></div>
  <label class="field"><span id="l_pos"></span></label><div class="seg" id="tpos"></div>
  <div class="note" id="posNote"></div>
</div>

<div class="card"><div class="toggle"><span id="l_bg"></span><div class="seg" id="bg" style="width:140px"></div></div>
  <div class="note" id="bgNote"></div></div>

<div class="card"><details><summary id="h_img"></summary>
  <div class="note" id="imgNote"></div>
  <label class="field"><span id="l_colors"></span></label><div class="seg" id="i_colors"></div>
  <label class="field"><span id="l_detail"></span></label><div class="seg" id="i_detail"></div>
  <label class="field"><span id="l_speckle"></span></label><div class="seg" id="i_speckle"></div>
  <label class="field"><span id="l_denoise"></span></label><div class="seg" id="i_denoise"></div>
  <label class="field"><span id="l_tol"></span></label><div class="seg" id="i_tol"></div>
</details></div>

<div class="card"><h2 id="h_fmt"></h2><div class="seg" id="fmt"></div><div class="note" id="fmtNote"></div></div>

<div id="sendFallback"><button class="btn" id="sendBtn"></button></div>

<script id="effects">

const SF = (function () {
  "use strict";
  const TAU = Math.PI * 2, CANVAS = 512;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const T = o => Object.assign({ dx: 0, dy: 0, sx: 1, sy: 1, rot: 0, opacity: 1 }, o);
  const win = (q, a, b) => (q < a || q > b) ? 0 : Math.pow(Math.sin(Math.PI * (q - a) / (b - a)), 2);
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; x = clamp(x, 0, 1); return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const LABELS = {"pulse": ["Pulse", "ضربان"], "bounce": ["Bounce", "پرش"], "shake": ["Shake", "لرزش"], "spin": ["Spin", "چرخش"], "fade": ["Fade", "محو شدن"], "float": ["Float", "شناور"], "heartbeat": ["Heartbeat", "تپش قلب"], "swing": ["Swing", "تاب"], "wobble": ["Wobble", "نوسان"], "jelly": ["Jelly", "ژله‌ای"], "tada": ["Tada", "تادا"], "hop": ["Hop", "جهش"], "orbit": ["Orbit", "مدار"], "flip": ["Flip", "چرخش سکه"], "zoompop": ["Zoom Pop", "ظهور"], "breathe": ["Breathe", "نفس"]};
  // Same formulas as engine/animation.py (checked against it by tests/test_miniapp.py).
  const defs = [
    ["pulse", p => { const k = .5 - .5 * Math.cos(TAU * p), s = 1 + .12 * k; return T({ sx: s, sy: s }); }],
    ["bounce", p => { const h = Math.abs(Math.sin(Math.PI * p)), sq = Math.pow(1 - h, 3); return T({ dy: -48 * h, sx: 1 + .06 * sq, sy: 1 - .10 * sq }); }],
    ["shake", p => T({ dx: 18 * Math.sin(TAU * 4 * p), rot: 4 * Math.sin(TAU * 4 * p + Math.PI / 3) - 4 * Math.sin(Math.PI / 3) })],
    ["spin", p => T({ rot: 360 * p }), false],
    ["fade", p => T({ opacity: .15 + .85 * (.5 + .5 * Math.cos(TAU * p)) })],
    ["float", p => T({ dx: 5 * Math.sin(TAU * 2 * p), dy: -14 * Math.sin(TAU * p), rot: 2 * Math.sin(TAU * p + Math.PI / 2) - 2 })],
    ["heartbeat", p => { let q = (p * 2) % 1; if (p >= 1) q = 0; const s = 1 + .16 * win(q, 0, .16) + .11 * win(q, .18, .36); return T({ sx: s, sy: s }); }],
    ["swing", p => { const th = 14 * Math.sin(TAU * 2 * p), r = th * Math.PI / 180; return T({ dx: -200 * Math.sin(r), dy: 200 * (Math.cos(r) - 1), rot: th }); }],
    ["wobble", p => { const a = Math.sin(TAU * 3 * p), b = Math.sin(TAU * 3 * p + Math.PI / 2); return T({ rot: 7 * a, sx: 1 + .04 * b, sy: 1 - .04 * b }); }],
    ["jelly", p => { let q = (p * 2) % 1; if (p >= 1) q = 0; const env = Math.exp(-4 * q) * Math.sin(TAU * 3 * q); return T({ sx: 1 + .2 * env, sy: 1 - .2 * env }); }],
    ["tada", p => { const q = Math.min(p, 1) / .6; if (q >= 1) return T({}); const env = Math.sin(Math.PI * q), s = 1 + .1 * env; return T({ sx: s, sy: s, rot: 7 * env * Math.sin(TAU * 4 * q) }); }],
    ["hop", p => { let q = (p * 3) % 1; if (p >= 1) q = 0; const h = Math.sin(Math.PI * q), sq = Math.pow(1 - h, 6); return T({ dx: 24 * Math.sin(TAU * p), dy: -36 * h, sx: 1 + .07 * sq - .03 * h, sy: 1 - .10 * sq + .04 * h, rot: 5 * Math.sin(TAU * p) }); }],
    ["orbit", p => T({ dx: 22 * Math.cos(TAU * p) - 22, dy: 22 * Math.sin(TAU * p) })],
    ["flip", p => { const sx = Math.max(.03, Math.abs(Math.cos(TAU * p))); return T({ sx: sx, sy: 1 + .04 * (1 - sx) }); }],
    ["zoompop", p => { p = clamp(p, 0, 1); let s, o; if (p < .28) { s = .3 + .7 * easeOutBack(p / .28); o = smooth(p / .12); } else if (p < .8) { s = 1; o = 1; } else { const k = smooth((p - .8) / .2); s = 1 - .7 * k; o = 1 - k; } return T({ sx: s, sy: s, opacity: clamp(o, 0, 1) }); }],
    ["breathe", p => { const k = .5 - .5 * Math.cos(TAU * p), s = 1 + .06 * k; return T({ dy: -6 * k, sx: s, sy: s, opacity: .85 + .15 * k }); }],
  ];
  const EFFECTS = defs.map(d => ({ key: d[0], fn: d[1], rotScales: d[2] !== false, en: LABELS[d[0]][0], fa: LABELS[d[0]][1] }));
  const BY_KEY = Object.fromEntries(EFFECTS.map(e => [e.key, e]));
  const SPEEDS = { slow: 3.0, normal: 2.0, fast: 1.0 };
  const INTENSITIES = { low: .6, normal: 1.0, high: 1.5 };
  const SIZES = { small: 34, medium: 52, large: 72, xlarge: 104 };
  const COLORS = { white: [255, 255, 255], yellow: [255, 214, 0], red: [244, 67, 54], green: [76, 175, 80],
                   blue: [33, 150, 243], pink: [255, 105, 180], orange: [255, 152, 0], black: [20, 20, 24] };
  const BAND = 112, OUTLINE_PAD = 12, OUTLINE_WIDTH = 7, SHADOW_OFFSET = [3, 6], BOX_W = CANVAS - 32, BOX_FREE_H = 220;

  function effectKeys(o) {
    const keys = [];
    for (const k of [o.effect, o.fx2, o.fx3]) if (k && BY_KEY[k] && keys.indexOf(k) < 0) keys.push(k);
    return keys;
  }
  /** -> {fn(phase)->Transform, duration} for the user's choices (mirrors build_effect / Composite). */
  function build(o) {
    const keys = effectKeys(o), k = INTENSITIES[o.intensity] || 1, duration = SPEEDS[o.speed] || 2;
    const parts = keys.map(x => BY_KEY[x]);
    const fn = p => {
      let dx = 0, dy = 0, rot = 0, sx = 1, sy = 1, op = 1;
      for (const e of parts) {
        const t = e.fn(p), rk = e.rotScales ? k : 1;
        dx += t.dx * k; dy += t.dy * k; rot += t.rot * rk;
        sx *= 1 + (t.sx - 1) * k; sy *= 1 + (t.sy - 1) * k; op *= 1 - (1 - t.opacity) * k;
      }
      return { dx, dy, rot, sx: Math.max(.03, sx), sy: Math.max(.03, sy), opacity: clamp(op, 0, 1) };
    };
    return { fn, duration };
  }
  function safeScale(fn, w, h, samples) {
    const hw = w / 2, hh = h / 2;
    return safeScaleCorners(fn, [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]], samples);
  }
  /** Same, for a box (x0, y0, x1, y1) in canvas coordinates (several pictures: the visible area is not centred). */
  function safeScaleBox(fn, box, samples) {
    const c = CANVAS / 2, [x0, y0, x1, y1] = box;
    return safeScaleCorners(fn, [[x0 - c, y0 - c], [x1 - c, y0 - c], [x1 - c, y1 - c], [x0 - c, y1 - c]], samples);
  }
  function safeScaleCorners(fn, corners, samples) {
    samples = samples || 240;
    const limit = CANVAS / 2 - 1; let best = 1;
    for (let i = 0; i <= samples; i++) {
      const t = fn(i / samples), th = t.rot * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
      for (const [px, py] of corners) {
        const ux = t.sx * px * c - t.sy * py * s, uy = t.sx * px * s + t.sy * py * c;
        for (const [u, d] of [[ux, t.dx], [uy, t.dy]]) {
          if (u > 1e-9) best = Math.min(best, (limit - d) / u);
          else if (u < -1e-9) best = Math.min(best, (-limit - d) / u);
        }
      }
    }
    return Math.max(.05, Math.min(1, best));
  }
  const needsRoom = o => !!o.text || o.outline !== "none";
  const band = o => (o.text && (o.text_pos === "top" || o.text_pos === "bottom")) ? BAND : 0;
  function artworkScale(o) {
    const pad = o.outline !== "none" ? OUTLINE_PAD : 0, b = band(o);
    const f = Math.min((CANVAS - 2 * pad) / CANVAS, (CANVAS - b - 2 * pad) / CANVAS);
    const cy = (o.text_pos === "top" && b) ? (CANVAS + b) / 2 : (CANVAS - b) / 2;
    return { f, cy };
  }
  function textCentre(o) {
    if (o.text_pos === "custom") return [o.text_x, o.text_y];
    if (o.text_pos === "top") return [CANVAS / 2, BAND / 2];
    if (o.text_pos === "center") return [CANVAS / 2, CANVAS / 2];
    return [CANVAS / 2, CANVAS - BAND / 2];
  }
  const captionBox = o => (o.text_pos === "top" || o.text_pos === "bottom") ? [BOX_W, BAND - 8] : [BOX_W, BOX_FREE_H];
  const outlineFor = rgb => (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) > 110 ? [20, 20, 24] : [255, 255, 255];
  // ----- caption effects (same formulas as engine/textfx.py) -----
  const TEXT_FX = ["sync", "static", "wave", "bend", "marquee", "neon", "typing", "handwriting", "threed"];
  const TEXT_FX_LABELS = {"sync": ["With the picture", "همراه تصویر"], "static": ["Still", "ثابت"], "wave": ["Wave", "موج"], "bend": ["Bend", "خمیدگی"], "marquee": ["Move across", "حرکت در صفحه"], "neon": ["Neon", "نئون"], "typing": ["Typing", "تایپ"], "handwriting": ["Handwriting", "دست‌نویس"], "threed": ["3D", "سه‌بعدی"]};
  const SEPARATE = TEXT_FX.filter(k => k !== "sync"), SINGLE_LINE = ["wave", "bend", "marquee", "typing"];
  // ----- up to three caption effects at once (same rules as textfx.clean_slots) -----
  const STACKABLE = ["wave", "bend", "marquee", "neon", "typing", "handwriting", "threed"], EXCLUSIVE = [["typing", "handwriting"]];
  function cleanSlots(fx1, fx2, fx3) {
    let first = TEXT_FX.indexOf(fx1) >= 0 ? fx1 : "sync";
    const chosen = STACKABLE.indexOf(first) >= 0 ? [first] : [], extras = [];
    for (const fx of [fx2, fx3]) {
      if (STACKABLE.indexOf(fx) < 0 || chosen.indexOf(fx) >= 0) continue;
      if (EXCLUSIVE.some(pr => pr.indexOf(fx) >= 0 && chosen.some(c => pr.indexOf(c) >= 0))) continue;
      chosen.push(fx); extras.push(fx);
    }
    if (extras.length && first === "sync") first = "static";
    return [first, extras[0] || null, extras[1] || null];
  }
  const stackOf = (a, b, c) => cleanSlots(a, b, c).filter(k => STACKABLE.indexOf(k) >= 0);
  const needsSingleLine = st => st.some(k => SINGLE_LINE.indexOf(k) >= 0);
  const isSeparate = o => cleanSlots(o.text_fx, o.text_fx2, o.text_fx3)[0] !== "sync";
  /** effects offered for slot 2 or 3 */
  function textChoices(o, slot) {
    const mine = slot === 2 ? o.text_fx2 : o.text_fx3, others = [o.text_fx, o.text_fx2, o.text_fx3].filter(k => k && k !== mine);
    return STACKABLE.filter(k => others.indexOf(k) < 0 && !EXCLUSIVE.some(pr => pr.indexOf(k) >= 0 && others.some(c => pr.indexOf(c) >= 0)));
  }
  // ----- several pictures in one sticker (same rules as engine/layers.py) -----
  const MAX_LAYERS = 8, MIN_SCALE = .1, MAX_SCALE = 3, POS_MIN = -CANVAS, POS_MAX = 2 * CANVAS;
  function clampSpec(x, y, s) {
    const num = (v, d) => { if (v === null || v === undefined || v === "") return d; v = Number(v); return isFinite(v) ? v : d; };
    return { x: clamp(num(x, CANVAS / 2), POS_MIN, POS_MAX), y: clamp(num(y, CANVAS / 2), POS_MIN, POS_MAX), s: clamp(num(s, 1), MIN_SCALE, MAX_SCALE) };
  }
  function autoLayout(n) {
    if (n <= 0) return [];
    if (n === 1) return [{ x: CANVAS / 2, y: CANVAS / 2, s: 1 }];
    const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols), cell = CANVAS / Math.max(cols, rows), out = [];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols), c = i % cols, inRow = r < rows - 1 ? cols : n - cols * (rows - 1);
      out.push(clampSpec((CANVAS - inRow * cell) / 2 + (c + .5) * cell, (CANVAS - rows * cell) / 2 + (r + .5) * cell, 1 / Math.max(cols, rows)));
    }
    return out;
  }
  const REVEAL_END = .6, HOLD_END = .92;
  const waveDy = (xn, p, amp) => amp * Math.sin(TAU * (xn * 1.0 - p));
  const BEND_ANGLE = 1.0;
  const bendPoint = (px, py, width) => { const r = width / BEND_ANGLE, th = px / r, rho = r - py; return [rho * Math.sin(th), r - rho * Math.cos(th)]; };
  const HEX = /^#?([0-9a-fA-F]{6})$/;
  const normalizeColor = (v, allowAuto) => { v = String(v || "").trim().toLowerCase(); if (allowAuto && v === "auto") return "auto"; if (COLORS[v]) return v; const m = HEX.exec(v); return m ? "#" + m[1] : null; };

    if (fontItems.some(i => i.name === name)) return;
    fontItems.push({ name, label });
    if (file) new FontFace(name, "url(fonts/" + file + ")").load().then(f => { document.fonts.add(f); buildFonts(); refresh(); }).catch(() => {});
  }
  async function loadFonts() {
    try { const list = await (await fetch("fonts.json")).json(); list.forEach(f => addFont(f.name, f.label || f.name, f.file)); } catch (e) { /* page hosted without fonts.json */ }
    fonts.forEach(n => addFont(n, n.replace(/[-_]/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2")));
    if (!S.font && !S.font_phone && fontItems.length) S.font = fontItems[0].name;
    buildFonts(); refresh();
  }
  $("fontFile").addEventListener("change", async e => {   // font from the phone: preview here, then send the file to the bot
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      const family = "phone" + Date.now(), face = new FontFace(family, await f.arrayBuffer()); await face.load(); document.fonts.add(face);
      fontItems.push({ phone: true, file: f.name, family, label: "📱 " + f.name.replace(/\.[^.]+$/, "") });
      S.font_phone = f.name; phoneFamily = family; S.font = ""; buildFonts(); refresh();
    } catch (err) { alert("Font error: " + err); }
  });

  // ---------- theme ----------
  function applyTheme(mode) {
    document.documentElement.dataset.theme = mode; $("themeBtn").textContent = mode === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("sf_theme", mode); } catch (e) {}
    try { if (tg) { tg.setHeaderColor(mode === "dark" ? "#17212b" : "#ffffff"); tg.setBackgroundColor(mode === "dark" ? "#17212b" : "#ffffff"); } } catch (e) {}
  }
  let saved = null; try { saved = localStorage.getItem("sf_theme"); } catch (e) {}
  applyTheme(saved || (tg && tg.colorScheme) || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("themeBtn").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

  // ---------- send ----------
  function payload() {
    const p = { v: 1, effect: S.effect, fx2: S.fx2 || null, fx3: S.fx3 || null, speed: S.speed, intensity: S.intensity, outline: S.outline,
      text: S.text.trim(), text_pos: S.text_pos, text_x: S.text_x, text_y: S.text_y, text_size: S.text_size, text_color: S.text_color,
      bg: !!S.bg, fmt: S.fmt, img: S.img, text_fx: S.text_fx, text_fx2: S.text_fx2 || null, text_fx3: S.text_fx3 || null, text_px: S.text_px, stroke_w: S.stroke_w, stroke_color: S.stroke_color };
    if (layersL.length > 1 || (layersL.length === 1 && !layersL[0].auto))     // where each picture sits, bottom -> top
      p.layers = layersL.map(l => ({ h: l.h, x: Math.round(l.x * 10) / 10, y: Math.round(l.y * 10) / 10, s: Math.round(l.s * 1000) / 1000 }));
    if (S.font) p.font = S.font;
    if (S.font_phone) p.font_phone = S.font_phone;
    return JSON.stringify(p);
  }
  function send() {
    const data = payload();
    if (data.length > 4000) { alert("Too much data for Telegram (" + data.length + " bytes). Remove a picture or shorten the text."); return; }
    if (tg) { tg.sendData(data); } else { alert(data); }
  }
  function updateMain() { if (tg) { tg.MainButton.setText(STR[lang].send); tg.MainButton.show(); } }
  $("sendBtn").onclick = send;
  if (tg) { tg.ready(); tg.expand(); tg.MainButton.onClick(send); updateMain(); } else { $("sendFallback").style.display = "block"; }

  build(); refresh(true); loadFonts(); requestAnimationFrame(frame);
})();
</script>
</body>
